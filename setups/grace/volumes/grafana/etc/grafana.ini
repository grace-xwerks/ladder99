# grafana config for the Grace Engineering setup.
#
# these override the defaults set here - https://github.com/grafana/grafana/blob/main/conf/defaults.ini
# see https://grafana.com/docs/grafana/latest/administration/configuration/
#
# note: this folder corresponds to /etc/grafana, as grafana sees it -
# services/docker-compose.yaml mounts setups/$SETUP/volumes/grafana/etc there.
#
# the image is grafana 10.4.19 - see services/grafana/Dockerfile for why that
# version and what plugins it carries.


[paths]

# Path to where Grafana stores the sqlite3 database (if used), file-based
# sessions (if used), and other data. This path is usually specified via
# command line in the init.d script or the systemd service file.
#. shouldn't this be /var/lib/grafana instead? it is what the example does, and
#. it means grafana.db lands in this (git-tracked, .gitignore'd via *.db) folder
#. rather than in the var mount. left as-is for consistency with the example.
data = /etc/grafana

provisioning = /etc/grafana/provisioning
plugins = /var/lib/grafana/plugins
logs = /var/lib/grafana/logs


# Grafana needs a database to store users and dashboards (and other things).
# By default it is configured to use sqlite3 which is an embedded database
# (included in the main Grafana binary).
# [database]
# Either mysql, postgres or sqlite3, it's your choice.
# type = sqlite3


[dashboards]

# Path to the default home dashboard. If this value is empty, then Grafana
# uses StaticRootPath + "dashboards/home.json".
# this must name a file that actually exists under volumes/grafana/etc/dashboards/
# (which mounts to /etc/grafana/dashboards) - if it doesn't, grafana logs
# 'failed to load home dashboard' and drops you on the built-in welcome page.
# fleet.json is this setup's overview of all six Mazak demo machines.
default_home_dashboard_path = /etc/grafana/dashboards/fleet.json


[panels]
# disable_sanitize_html allows <script> in text panels, which the example setup
# wanted so a dashboard variable could be turned into an image url.
# it is a real XSS hole - anyone who can edit a panel can run javascript in every
# viewer's browser - and it never actually worked for the example either.
# leave it off. if a panel needs computed content, compute it in the query.
# disable_sanitize_html = true


[auth.anonymous]
#enabled = true
#disable_login_form = true
# if you enable anonymous access above, org_name must name an org that ACTUALLY
# EXISTS, or auth fails closed with '[org.notFound] failed to get org by name'
# and every request 302s to /login.
# 'Main Org.' (with the trailing period) is the org grafana creates on a fresh
# install, so this works out of the box. the example shipped 'MRIIOT', which no
# install has - meaning enabling the setting above as shipped could never work.
org_name = Main Org.
org_role = Viewer


[security]
admin_user = admin
allow_embedding = true

# THIS SETUP IS DELIBERATELY ANGULAR-FREE.
#
# grafana 10.4 still defaults this to true, 11 turns it off, and 12 removes
# AngularJS entirely. the example setup depends on it: its dashboards use
# natel-discrete-panel and the old `graph` panel, both AngularJS, and that
# dependency is the reason the image is pinned below 11.
#
# we are not carrying that forward. every panel in this setup's dashboards must
# be a react panel (timeseries, state-timeline, stat, table, ...). setting this
# to false is the enforcement: if someone reintroduces an angular panel, it fails
# LOUDLY - the panel renders an "Angular plugin support is disabled" error -
# instead of quietly working here and then going blank on the next grafana bump.
#
# verified against grafana 10.4.19's conf/defaults.ini: this key lives in
# [security], not [panels]. putting it in the wrong section is silently ignored,
# which would leave angular ENABLED while looking like it was turned off.
# note: grafana 12 REMOVED angular entirely, so this key no longer does
# anything - an angular panel now fails to load whatever you set here. kept
# as documentation of intent, and so the setting is already correct if this
# setup is ever run against an older grafana.
angular_support_enabled = false

# if you put a reverse proxy (traefik, teleport) in front of grafana and hit
# 'Origin not allowed', set root_url under [server] to the external url and add
# the origin here - that error is what kept the example pinned to 8.2.2 for years.
# csrf_trusted_origins = example.com


[alerting]
# Set to false to enable Grafana alerting and to disable legacy alerting engine
enabled = false

[unified_alerting]
# enable the new alerting engine.
# note: provisioning/alerting/ must exist even when empty, or grafana logs an
# error on every start - that is what the .gitkeep in there is for.
enabled = true
