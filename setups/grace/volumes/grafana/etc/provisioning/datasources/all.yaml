# see https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources

# grafana reads this on every start and creates/updates the datasource, so the
# dashboards can reference it by uid without anyone clicking through the ui.
# the $VARS below are read from the grafana container's environment - see the
# grafana service in services/docker-compose.yaml, which passes PGHOST etc
# through from this setup's .env file.

# config file version
apiVersion: 1

# # list of datasources to delete
# deleteDatasources:
#   - name: Graphite
#     orgId: 1

# list of datasources to insert/update
datasources:
  - name: Postgres
    type: postgres

    # custom UID which can be used to reference this datasource in
    # other parts of the configuration, if not specified will be generated automatically.
    # the dashboards reference this uid, so DON'T CHANGE IT - every panel in
    # every dashboard json would have to change with it.
    uid: timescaledb

    # access mode. proxy or direct (Server or Browser in the UI). Required
    # 'direct' (browser) access was deprecated in grafana 7 and removed later.
    # it never meant anything for a SQL datasource anyway - postgres is always
    # queried server-side, by the grafana backend.
    access: proxy

    # url: host.docker.internal:5433 # for macos
    # url: postgres:5432
    url: $PGHOST:$PGPORT
    user: $PGUSER
    database: $PGDATABASE

    # enable/disable basic auth
    basicAuth: false

    # enable/disable with credentials headers
    withCredentials: false

    # mark as default datasource. Max one per org
    isDefault: true

    # fields that will be converted to json and stored in jsonData
    jsonData:
      graphiteVersion: '1.1'
      tlsAuth: false
      tlsAuthWithCACert: false
      postgresVersion: 1300 # postgres v13
      sslmode: disable
      timescaledb: true # uses timescaledb extension

    # json object of data that will be encrypted
    secureJsonData:
      password: $PGPASSWORD

    # allow users to edit datasources from the UI
    editable: true

    version: 1
