# MTConnect Agent configuration - Grace Engineering
# See https://github.com/MTConnect/cppagent#configuration for details

# this is the LOCAL agent. it serves exactly one device - Host - fed over SHDR by
# the local adapter. the six Mazak demo agents are remote agents that already
# speak MTConnect; the relay reads them over http and none of them appear here.

# THREE FILES MUST AGREE, or the agent crash-loops and the logs are unhelpful:
#   setup.yaml   adapter.devices[].id   -> agent.xml <Device id>
#   setup.yaml   adapter.devices[].name -> agent.xml <Device name> AND the
#                                          Adapters block name below
#   setup.yaml   adapter.devices[].outputs.agent.port -> the Port below
# for the host device those are: id 'host', name 'Host', port 7890.

# note: keep this RELATIVE. the agent resolves it against its config search
# paths, which include the directory this file is mounted in
# (/mtconnect/config - see the agent service in services/docker-compose.yaml).
# an absolute '/data/agent/agent.xml' was correct for the old ladder99/agent
# image and its `working_dir: /data/agent`, but upstream swapped in
# mtconnect/agent and moved the mount. that path no longer exists, so the agent
# exits with 'Cannot find device configuration file' and docker restarts it
# forever. don't "fix" this by making it absolute.
Devices = agent.xml
AllowPut = true # allow HTTP PUT or POST of data item values or assets. default false.
BufferSize = 17 # 2^n slots available for samples, events, conditions
# MonitorConfigFiles = true # wary of using this
Pretty = true # print the xml with indentation
ReconnectInterval = 10000 # amount of time between adapter reconnection attempts, ms
# SchemaVersion = 2.0 # use this if running an Agent 2.x image
# ShdrVersion = 2 # this seemed to cause problems - agent sometimes couldn't find dataitems in shdr

# Adapter SHDR connections
# Adapter name (eg Host) here must match device NAME in setup.yaml and agent.xml.
# Host and Port must match those in setup.yaml.
# one block per adapter device, each on its own port.
Adapters {
   Host { # note: Host here is the device name
      Host = adapter # note: Host here is the ip host property - the adapter Docker service
      Port = 7890
   }

   #. uncomment along with the Brother block in setup.yaml and the Devices in
   #. agent.xml, once machines 879 (cnc23) and 880 (cnc27) are cabled.
   #. the block names must match the device names in setup.yaml (Brother879,
   #. Brother880), and the ports must match outputs.agent.port there.
   # Brother879 {
   #    Host = adapter
   #    Port = 7891
   # }
   # Brother880 {
   #    Host = adapter
   #    Port = 7892
   # }
}

# Logging
# need at least warn level to diagnose path problems.
# in particular, an SHDR key with no matching DataItem in agent.xml is reported
# at warn - that is how you find out a schema output and the xml drifted apart.
# level = fatal|info|warn|debug|trace, default is info
# note: when agent run with 'agent debug', will set logging_level to debug
logger_config {
  logging_level = warn
  output = cout # or cerr. defaults to agent.log, which don't need as Docker captures output anyway
}

# Stylesheets
# these convert xml to html, so http://localhost:5000/current is readable
Files {
   styles {
      Path = /etc/mtconnect/styles
      Location = /styles
   }
   Favicon {
      Path = /etc/mtconnect/styles/favicon.ico
      Location = /favicon.ico
   }
}
DevicesStyle { Location = /styles/styles.xsl }
StreamsStyle { Location = /styles/styles.xsl }
